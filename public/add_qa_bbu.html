<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add BBU Entries - QA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="./js/auth_guard.js"></script>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #f4f6f9 0%, #e8ecf1 100%);
      padding: 20px; min-height: 100vh; color: #333;
    }
    h1 { text-align: center; margin-bottom: 10px; color: #0b5ed7; font-weight: 700; font-size: 28px; }
    .subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
    .form-container {
      max-width: 900px; margin: auto; background: #ffffff;
      padding: 30px 35px; border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    }
    .project-info {
      background: #e7f1ff; border: 1px solid #b6d4fe;
      border-radius: 8px; padding: 15px 20px; margin-bottom: 25px;
    }
    .project-info strong { color: #0b5ed7; }
    .upload-area {
      border: 2px dashed #cfd4da; border-radius: 10px;
      padding: 40px 20px; text-align: center;
      background: #f8f9fa; transition: all 0.3s;
      cursor: pointer; margin-bottom: 20px;
    }
    .upload-area:hover { border-color: #0b5ed7; background: #e7f1ff; }
    .upload-area i { font-size: 3rem; color: #0b5ed7; margin-bottom: 10px; }
    .upload-area p { margin: 0; color: #666; }
    .upload-area input[type=file] { display: none; }
    .btn-group { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
    button, .btn-back {
      padding: 12px 32px; font-size: 15px; font-weight: 600;
      border: none; border-radius: 6px; cursor: pointer;
      transition: all 0.3s; min-width: 140px;
      text-decoration: none; display: inline-block; text-align: center;
    }
    .btn-submit {
      background: linear-gradient(to right, #0b5ed7, #0a58ca);
      color: #fff; box-shadow: 0 4px 6px rgba(11, 94, 215, 0.2);
    }
    .btn-submit:hover { background: linear-gradient(to right, #0a58ca, #0950b8); box-shadow: 0 6px 12px rgba(11, 94, 215, 0.3); transform: translateY(-2px); }
    .btn-back {
      background: linear-gradient(to right, #6c757d, #5c636a);
      color: #fff; box-shadow: 0 4px 6px rgba(108, 117, 125, 0.2);
    }
    .btn-back:hover { background: linear-gradient(to right, #5c636a, #495057); box-shadow: 0 6px 12px rgba(108, 117, 125, 0.3); transform: translateY(-2px); color: #fff; }
    .status-message {
      padding: 12px 20px; border-radius: 8px; margin-top: 15px;
      display: none; font-weight: 500;
    }
    .status-message.success { background: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; display: block; }
    .status-message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }
    .status-message.info { background: #cff4fc; color: #055160; border: 1px solid #b6effb; display: block; }
    .file-name { font-size: 14px; color: #666; margin-top: 8px; }
    @media (max-width: 768px) {
      body { padding: 15px; }
      .form-container { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h1><i class="bi bi-upload me-2"></i>Upload BBU Excel</h1>
    <p class="subtitle">Upload an Excel file containing BBU (Bill of Quantities) details for the project.</p>

    <div class="project-info" id="projectInfo">
      <strong>Project:</strong> <span id="projectNameDisplay">Loading...</span>
      <input type="hidden" id="projectId" />
    </div>

    <div class="upload-area" id="uploadArea">
      <i class="bi bi-cloud-upload"></i>
      <p><strong>Click to upload BBU Excel</strong></p>
      <p class="text-muted" style="font-size: 13px;">Supports .xlsx, .xls files (Max 50 MB)</p>
      <input type="file" id="bbuFileInput" accept=".xlsx,.xls" />
    </div>
    <div class="file-name" id="fileName"></div>

    <div class="status-message" id="statusMessage"></div>

    <div class="btn-group">
      <a href="/qa_external.html" class="btn-back"><i class="bi bi-arrow-left me-1"></i>Back to QA Dashboard</a>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    $(document).ready(function () {
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('project_id');
      const projectName = urlParams.get('project_name') || '';

      if (projectId) {
        $('#projectId').val(projectId);
        $('#projectNameDisplay').text(decodeURIComponent(projectName));
      } else {
        Swal.fire({ icon: 'error', title: 'Error', text: 'Project ID is required.' }).then(() => { window.location.href = '/qa_external.html'; });
      }

      // File input change handler
      $('#bbuFileInput').on('change', function () {
        const fileName = this.files[0] ? this.files[0].name : '';
        $('#fileName').text(fileName ? 'Selected: ' + fileName : '');
      });

      // Upload area click triggers file input
      $('#uploadArea').on('click', function () {
        $('#bbuFileInput').trigger('click');
      });

      // Auto-upload when file is selected
      $('#bbuFileInput').on('change', function () {
        const file = this.files[0];
        if (!file) return;
        if (!projectId) { showStatus('Please select a project.', 'error'); return; }

        const formData = new FormData();
        formData.append('bbu_excel', file);

        showStatus('Uploading BBU Excel...', 'info');

        authFetch(`/api/data/qa/project/${projectId}/bbu/upload`, {
          method: 'POST',
          body: formData,
        })
          .then((res) => res.json())
          .then((resObj) => {
            if (resObj.success) {
              showStatus(`Upload successful! ${resObj.data ? resObj.data.createdCount : 0} entries created.`, 'success');
              setTimeout(() => { window.location.href = '/qa_external.html'; }, 2000);
            } else {
              showStatus(resObj.message || 'Upload failed.', 'error');
            }
          })
          .catch((err) => {
            console.error('Upload error:', err);
            showStatus('An error occurred during upload.', 'error');
          });
      });

      function showStatus(msg, type) {
        const el = $('#statusMessage');
        el.text(msg).removeClass('success error info').addClass(type).show();
      }

      function authFetch(url, options = {}) {
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = '/'; return Promise.reject('No token'); }
        const headers = { Authorization: `Bearer ${token}` };
        return fetch(url, { ...options, headers: { ...headers, ...(options.headers || {}) } })
          .then((res) => {
            if (res.status === 401) { localStorage.clear(); window.location.href = '/'; return Promise.reject('Unauthorized'); }
            return res;
          });
      }
    });
  </script>
</body>
</html>
