    <link rel="stylesheet" href="css/style.css" />

    <style>

      h1 {

        font-size: 28px;
      }

      .subtitle {
        text-align: center;

        margin-bottom: 30px;

        margin-left: auto;
        margin-right: auto;
      }

      .form-container {
        max-width: 1000px;
        margin: auto;

      form {

      .form-section {

        font-weight: 600;
        font-size: 18px;
      }
        /* now in 

      .form-group {
        display: flex;
        flex-direction: column;
      }

      label {
        font-weight: 600;
        font-size: 14px;
        color: #333;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
      }

      .required::after {
        content: " *";
        color: #dc3545;
      }

      input, textarea, select {
        width: 100%;
        padding: 12px;
        font-size: 15px;
        border: 1px solid #cfd4da;
        border-radius: 6px;
        transition: all 0.3s;
        font-family: inherit;
        background: #fff;
      }

      input:focus, textarea:focus, select:focus {

        box-shadow: 0 0 0 3px rgba(11, 94, 215, 0.15);
      }

      textarea {

        min-height: 80px;

      select {
        cursor: pointer;

      }

      .full-width {
        grid-column: span 2;
      }

      .btn-group {
        display: flex;
        justify-content: center;

      button, .btn-back {

        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s;
        min-width: 140px;
        text-decoration: none;

        text-align: center;
      }

      .btn-submit {
        background: linear-gradient(to right, #0b5ed7, #0a58ca);

        box-shadow: 0 6px 12px rgba(11, 94, 215, 0.3);

        color: #fff;

      .btn-back:hover {
        background: linear-gradient(to right, #5c636a, #495057);
        box-shadow: 0 6px 12px rgba(108, 117, 125, 0.3);
        transform: translateY(-2px);

        color: #721c24;
        padding: 12px 15px;

  </head>
  <body>
    <h1>Add Business Development Milestone</h1>
    <p class="subtitle">
      Add a new milestone to track progress for your Business Development entry
    </p>

    <div class="form-container">
      <div id="validation-summary" class="validation-summary">
        <strong>Please correct the following errors:</strong>
        <ul id="validation-errors"></ul>
      </div>

      <form id="milestoneForm">
        <div class="form-section">Milestone Details</div>

        <div class="form-group full-width">
          <label for="milestone_name" class="required">Milestone Name</label>
          <textarea id="milestone_name" name="milestone_name" rows="3" required placeholder="Enter milestone details..."></textarea>
        </div>

        <div class="form-group">
          <label for="milestone_date" class="required">Milestone Date</label>
          <input type="date" id="milestone_date" name="milestone_date" required />
        </div>

        <div class="form-group">
          <label for="milestone_status" class="required">Status</label>
          <select id="milestone_status" name="milestone_status" required>
            <option value="in-progress">In Progress</option>
            <option value="complete">Complete</option>
          </select>
        </div>

        <div class="btn-group full-width">
          <button type="submit" class="btn-submit">Submit</button>
          <a href="/business_development_external.html" class="btn-back">Back</a>
        </div>
      </form>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const bd_entry_id = params.get("bd_entry_id");

        if (!bd_entry_id) {
          alert("Invalid access: No Business Development Entry ID provided.");
          window.location.href = "/business_development_external.html";
          return;
        }

        document
          .getElementById("milestoneForm")
          .addEventListener("submit", function (e) {
            e.preventDefault();

            const validationErrors = [];
            const errorList = document.getElementById("validation-errors");
            const summary = document.getElementById("validation-summary");
            errorList.innerHTML = "";
            summary.style.display = "none";

            const milestone_name = document.getElementById("milestone_name").value.trim();
            const milestone_date = document.getElementById("milestone_date").value;
            const milestone_status = document.getElementById("milestone_status").value;

            if (!milestone_name) validationErrors.push("Milestone Name is required");
            if (!milestone_date) validationErrors.push("Milestone Date is required");

            if (validationErrors.length > 0) {
              validationErrors.forEach(function(err) {
                const li = document.createElement("li");
                li.textContent = err;
                errorList.appendChild(li);
              });
              summary.style.display = "block";
              summary.scrollIntoView({ behavior: "smooth", block: "center" });
              return;
            }

            const data = {
              bd_entry_id,
              milestone_name,
              milestone_date,
              milestone_status,
              is_active: "true",
            };

            authFetch("/api/data/bd/milestone/add", {
              method: "POST",
              body: JSON.stringify(data),
            })
              .then((res) => {
                if (!res.ok) throw new Error("Failed to add milestone.");
                alert("Milestone added successfully.");
                window.location.href = "/business_development_external.html";
              })
              .catch((err) => {
                console.error(err);
                alert("Error adding milestone.");
              });
          });

        function authFetch(url, options = {}) {
          const token = localStorage.getItem("token");
          const defaultHeaders = {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          };

          return fetch(url, {
            ...options,
            headers: {
              ...defaultHeaders,
              ...(options.headers || {}),
            },
          }).then((res) => {
            if (res.status === 401) {
              alert("Session expired. Redirecting to login...");
              localStorage.clear();
              window.location.href = "/";
              throw new Error("Unauthorized");
            }
            return res;
          });
        }
      });
    </script>
  </body>
</html>
