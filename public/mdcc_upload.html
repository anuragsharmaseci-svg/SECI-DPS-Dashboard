<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MDCC Upload & Inspection</title>

    <script src="./js/auth_guard.js"></script>
    <link rel="stylesheet" href="css/style.css" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        background: linear-gradient(135deg, #f4f6f9 0%, #e8ecf1 100%);
        padding: 20px;
        min-height: 100vh;
        color: #333;
      }

      h1 {
        text-align: center;
        margin-bottom: 10px;
        color: #0b5ed7;
        font-weight: 700;
        font-size: 28px;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
        font-size: 14px;
      }

      .form-container {
        max-width: 1000px;
        margin: auto;
        background: #ffffff;
        padding: 30px 35px;
        border-radius: 12px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      }

      form {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px 30px;
      }

      .form-section {
        grid-column: span 2;
        margin-top: 10px;
        margin-bottom: 5px;
        padding-bottom: 8px;
        border-bottom: 2px solid #0b5ed7;
        color: #0b5ed7;
        font-weight: 600;
        font-size: 18px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
      }

      label {
        font-weight: 600;
        font-size: 14px;
        color: #333;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
      }

      .required::after {
        content: " *";
        color: #dc3545;
      }

      input,
      textarea,
      select {
        width: 100%;
        padding: 12px;
        font-size: 15px;
        border: 1px solid #cfd4da;
        border-radius: 6px;
        transition: all 0.3s;
        font-family: inherit;
      }

      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: #0b5ed7;
        box-shadow: 0 0 0 3px rgba(11, 94, 215, 0.15);
      }

      textarea {
        resize: vertical;
        min-height: 80px;
      }

      .full-width {
        grid-column: span 2;
      }

      .btn-group {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
      }

      button,
      .btn-back {
        padding: 12px 32px;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s;
        min-width: 140px;
        text-decoration: none;
        display: inline-block;
        text-align: center;
      }

      .btn-submit {
        background: linear-gradient(to right, #0b5ed7, #0a58ca);
        color: #fff;
        box-shadow: 0 4px 6px rgba(11, 94, 215, 0.2);
      }

      .btn-submit:hover {
        background: linear-gradient(to right, #0a58ca, #0950b8);
        box-shadow: 0 6px 12px rgba(11, 94, 215, 0.3);
        transform: translateY(-2px);
      }

      .btn-back {
        background: linear-gradient(to right, #6c757d, #5c636a);
        color: #fff;
        box-shadow: 0 4px 6px rgba(108, 117, 125, 0.2);
      }

      .btn-back:hover {
        background: linear-gradient(to right, #5c636a, #495057);
        box-shadow: 0 6px 12px rgba(108, 117, 125, 0.3);
        transform: translateY(-2px);
        color: #fff;
      }

      .file-input-wrapper {
        position: relative;
        overflow: hidden;
        display: inline-block;
        width: 100%;
      }

      .file-input-wrapper input[type="file"] {
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
        padding: 0;
        border: none;
      }

      .file-input-display {
        padding: 16px 20px;
        border: 2px dashed #cfd4da;
        border-radius: 6px;
        text-align: center;
        cursor: pointer;
        background: #f8f9fa;
        transition: all 0.3s;
        color: #6c757d;
        font-size: 14px;
      }

      .file-input-display:hover {
        border-color: #0b5ed7;
        background: #e7f1ff;
        color: #0b5ed7;
      }

      .file-input-display.has-files {
        border-color: #198754;
        background: #d1e7dd;
        color: #0f5132;
      }

      .selected-files-list {
        margin-top: 10px;
        padding: 10px;
        background: #f8f9fa;
        border-radius: 6px;
        max-height: 200px;
        overflow-y: auto;
      }

      .selected-file-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 10px;
        margin-bottom: 4px;
        background: white;
        border: 1px solid #dee2e6;
        border-radius: 4px;
        font-size: 13px;
      }

      .selected-file-item .file-remove {
        background: none;
        border: none;
        color: #dc3545;
        cursor: pointer;
        padding: 0 4px;
        font-size: 14px;
        min-width: auto;
      }

      .existing-files-list {
        margin-top: 10px;
        padding: 10px;
        background: #f8f9fa;
        border-radius: 6px;
      }

      .existing-file-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        margin-bottom: 6px;
        background: white;
        border: 1px solid #dee2e6;
        border-radius: 4px;
        font-size: 13px;
      }

      .existing-file-item a {
        color: #0b5ed7;
        text-decoration: none;
        font-weight: 500;
      }

      .existing-file-item a:hover {
        text-decoration: underline;
      }

      .mdcc-info {
        background: #e7f1ff;
        border: 1px solid #b6d4fe;
        border-radius: 8px;
        padding: 15px 20px;
        margin-bottom: 5px;
        grid-column: span 2;
      }

      .mdcc-info strong {
        color: #0b5ed7;
      }

      .status-message {
        padding: 12px 20px;
        border-radius: 8px;
        margin-bottom: 15px;
        display: none;
        font-weight: 500;
        grid-column: span 2;
      }

      .status-message.success {
        background: #d1e7dd;
        color: #0f5132;
        border: 1px solid #badbcc;
        display: block;
      }

      .status-message.error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
        display: block;
      }

      .status-message.info {
        background: #cff4fc;
        color: #055160;
        border: 1px solid #b6effb;
        display: block;
      }

      .warning-box {
        background: #fff3cd;
        border: 1px solid #ffeaa7;
        color: #856404;
        padding: 12px 15px;
        border-radius: 6px;
        font-size: 13px;
        margin-top: 8px;
      }

      @media (max-width: 768px) {
        body {
          padding: 15px;
        }
        .form-container {
          padding: 20px;
        }
        form {
          grid-template-columns: 1fr;
        }
        .form-section,
        .full-width,
        .mdcc-info,
        .status-message {
          grid-column: span 1;
        }
      }
    </style>
  </head>
  <body>
    <h1>MDCC Upload & Inspection</h1>
    <p class="subtitle">Upload documents and fill in inspection details for the MDCC</p>

    <div class="form-container">
      <form id="mdccUploadForm">
        <div class="mdcc-info" id="mdccInfo">
          <strong>MDCC:</strong> <span id="mdccNoDisplay">Loading...</span>
          &nbsp;|&nbsp;
          <strong>Project:</strong> <span id="projectNameDisplay">Loading...</span>
        </div>

        <div class="status-message" id="statusMessage"></div>

        <div class="form-section">Upload Documents</div>

        <div class="form-group full-width">
          <label for="uploadedFiles">Upload Documents (Up to 20 files, PDF/Word/Excel)</label>
          <div class="file-input-wrapper">
            <div class="file-input-display" id="fileInputDisplay">
              <span id="fileInputText">Click to browse or drag and drop files here (PDF, DOC, DOCX, XLS, XLSX)</span>
            </div>
            <input type="file" id="uploadedFiles" multiple accept=".pdf,.doc,.docx,.xls,.xlsx" />
          </div>
          <div id="selectedFilesList" class="selected-files-list" style="display:none;"></div>
        </div>

        <div class="form-group full-width" id="existingFilesSection" style="display:none;">
          <label>Previously Uploaded Files</label>
          <div id="existingFilesList" class="existing-files-list"></div>
        </div>

        <div class="form-section">Inspection Details</div>

        <div class="form-group">
          <label for="inspectedBy" class="required">Inspected By</label>
          <input type="text" id="inspectedBy" placeholder="Enter inspector name" />
        </div>

        <div class="form-group">
          <label for="mandays" class="required">No. of ManDays</label>
          <select id="mandays">
            <option value="">Select...</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
        </div>

        <div class="full-width btn-group">
          <a href="/qa_external.html" class="btn-back">Back to QA Dashboard</a>
          <button type="submit" class="btn-submit">Save MDCC</button>
        </div>
      </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      // Auth fetch wrapper
      function authFetch(url, options = {}) {
        const token = localStorage.getItem("token");
        if (!token) { window.location.href = "/"; return Promise.reject("No token found"); }
        const defaultHeaders = { "Content-Type": "application/json", Authorization: `Bearer ${token}` };
        return fetch(url, { ...options, headers: { ...defaultHeaders, ...(options.headers || {}) } })
          .then((res) => {
            if (res.status === 401) {
              localStorage.clear(); window.location.href = "/"; throw new Error("Unauthorized");
            }
            return res;
          });
      }

      // Get URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get("project_id");
      const bbuSlNo = urlParams.get("bbu_sl_no");
      const bbuId = urlParams.get("bbu_id");
      const mdccId = urlParams.get("mdcc_id");
      const isEdit = !!mdccId;

      // Store for selected files (File objects)
      let selectedFiles = [];
      // Store existing uploaded file metadata (for display + merging on save)
      let existingFiles = [];

      async function checkUserQaAccess() {
        try {
          const token = localStorage.getItem('token');
          if (!token) return 'none';
          const payload = JSON.parse(atob(token.split('.')[1]));
          if (payload && payload.role === 'admin') return 'head';
          if (payload && payload.role === 'viewer') return 'view';
          const userId = payload && payload.user_id;
          if (!userId) return 'none';

          const res = await authFetch(`/api/data/departments/user/${encodeURIComponent(userId)}`);
          if (!res.ok) return 'edit';
          const data = await res.json();
          const list = Array.isArray(data.departments) ? data.departments : [];
          const norm = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');

          for (const deptInfo of list) {
            const id = (deptInfo && (deptInfo.dept_id || deptInfo)) || null;
            if (!id) continue;
            const deptRes = await authFetch(`/api/data/departments/${encodeURIComponent(id)}`);
            if (!deptRes.ok) continue;
            const dept = await deptRes.json();
            if (!dept || !dept.dept_name) continue;
            const normName = norm(dept.dept_name);
            if (normName.includes('qa') || normName.includes('quality')) {
              const raw = String((deptInfo && deptInfo.access_level) || '').trim().toLowerCase();
              if (raw === 'view' || raw === 'edit' || raw === 'head') return raw;
              return (deptInfo && deptInfo.can_edit === true) ? 'edit' : 'view';
            }
          }
          return 'edit';
        } catch(e) {
          return 'edit';
        }
      }

      $(document).ready(function () {
        checkUserQaAccess().then(access => {
          if (access === 'view' || access === 'none') {
            $("#uploadedFiles").prop("disabled", true);
            $("#inspectedBy, #mandays").prop("disabled", true);
            $(".btn-submit").hide();
            $("#fileInputDisplay").css({ opacity: 0.6, cursor: "not-allowed", pointerEvents: "none" });
            showStatus("View-only mode: You cannot edit inspection details or upload documents.", "info");
          }
        });

        if (!mdccId) {
          showStatus(
            "No MDCC ID provided. Please save the MDCC form first to access this page.",
            "error"
          );
          $("#mdccUploadForm input, #mdccUploadForm select, #mdccUploadForm textarea, #mdccUploadForm button[type=submit]").prop("disabled", true);
          return;
        }

        if (!projectId) {
          showStatus("Project ID is required.", "error");
          return;
        }

        loadMdccDetails();
        loadExistingFiles();

        // File input change handler
        $("#uploadedFiles").on("change", handleFileSelect);

        // Drag and drop
        const dropZone = $("#fileInputDisplay");
        dropZone.on("dragover", function (e) {
          e.preventDefault();
          e.stopPropagation();
          $(this).css("background", "#e7f1ff");
        });
        dropZone.on("dragleave", function (e) {
          e.preventDefault();
          e.stopPropagation();
          $(this).css("background", "");
        });
        dropZone.on("drop", function (e) {
          e.preventDefault();
          e.stopPropagation();
          $(this).css("background", "");
          const files = e.originalEvent.dataTransfer.files;
          if (files && files.length) {
            addFiles(files);
          }
        });

        // Form submit
        $("#mdccUploadForm").on("submit", handleSubmit);
      });

      function showStatus(message, type) {
        const el = $("#statusMessage");
        el.removeClass("success error info").addClass(type);
        el.text(message).show();
      }

      function hideStatus() {
        $("#statusMessage").hide();
      }

      async function loadMdccDetails() {
        try {
          const res = await authFetch(`/api/data/qa/project/${projectId}/mdcc/all`);
          const resObj = await res.json();
          if (resObj.success && resObj.data) {
            const mdcc = resObj.data.find((m) => String(m.mdcc_id) === String(mdccId));
            if (mdcc) {
              $("#mdccNoDisplay").text(mdcc.mdcc_no || "-");
              $("#inspectedBy").val(mdcc.inspected_by || "");
              $("#mandays").val(mdcc.mandays || "");

              // Load project name
              try {
                const projRes = await authFetch("/api/data/qa/projects/all");
                const projData = await projRes.json();
                if (projData.success && projData.data) {
                  const project = projData.data.find((p) => String(p.qa_project_id) === String(projectId));
                  if (project) {
                    $("#projectNameDisplay").text(project.project_name || "-");
                  }
                }
              } catch (projErr) {
                console.error("Error loading project:", projErr);
                $("#projectNameDisplay").text("-");
              }
            } else {
              showStatus("MDCC entry not found.", "error");
            }
          } else {
            showStatus("Failed to load MDCC details.", "error");
          }
        } catch (err) {
          console.error("Error loading MDCC details:", err);
          showStatus("An error occurred while loading MDCC details.", "error");
        }
      }

      async function loadExistingFiles() {
        try {
          const res = await authFetch(`/api/data/qa/project/${projectId}/mdcc/all`);
          const resObj = await res.json();
          if (resObj.success && resObj.data) {
            const mdcc = resObj.data.find((m) => String(m.mdcc_id) === String(mdccId));
            if (mdcc && mdcc.uploaded_files) {
              try {
                const filesArr = JSON.parse(mdcc.uploaded_files);
                if (Array.isArray(filesArr) && filesArr.length > 0) {
                  existingFiles = filesArr;
                  renderExistingFiles();
                }
              } catch (e) {
                console.error("Error parsing uploaded_files:", e);
              }
            }
          }
        } catch (err) {
          console.error("Error loading existing files:", err);
        }
      }

      function renderExistingFiles() {
        if (!existingFiles || existingFiles.length === 0) {
          $("#existingFilesSection").hide();
          return;
        }
        $("#existingFilesSection").show();
        const html = existingFiles
          .map(
            (f, idx) => `
          <div class="existing-file-item">
            <a href="${escapeHtml(f.path)}" target="_blank">${escapeHtml(f.original_name)}</a>
            <button type="button" class="file-remove" data-idx="${idx}" style="background:none;border:none;color:#dc3545;cursor:pointer;padding:0 4px;font-size:14px;min-width:auto;">Remove</button>
          </div>`
          )
          .join("");
        $("#existingFilesList").html(html);
        $("#existingFilesList").find(".file-remove").on("click", function () {
          const idx = $(this).data("idx");
          existingFiles.splice(idx, 1);
          renderExistingFiles();
        });
      }

      function handleFileSelect(e) {
        const files = e.target.files;
        if (files && files.length) {
          addFiles(files);
        }
        // Reset the input so the same file can be re-selected if needed
        e.target.value = "";
      }

      function addFiles(fileList) {
        const allowedExtensions = [".pdf", ".doc", ".docx", ".xls", ".xlsx"];

        const totalAfterAdd = selectedFiles.length + fileList.length;
        if (totalAfterAdd > 20) {
          Swal.fire({
            icon: "warning",
            title: "Limit Exceeded",
            text: `You can upload a maximum of 20 files. You already have ${selectedFiles.length} new file(s) selected.`,
          });
          return;
        }

        for (const file of fileList) {
          const ext = "." + file.name.split(".").pop().toLowerCase();
          if (!allowedExtensions.includes(ext)) {
            Swal.fire({
              icon: "error",
              title: "Invalid File",
              text: `"${file.name}" is not a valid file type. Only PDF, DOC, DOCX, XLS, XLSX are allowed.`,
            });
            continue;
          }
          selectedFiles.push(file);
        }
        renderSelectedFiles();
      }

      function renderSelectedFiles() {
        const container = $("#selectedFilesList");
        if (selectedFiles.length === 0) {
          container.hide();
          $("#fileInputDisplay").removeClass("has-files");
          $("#fileInputText").text("Click to browse or drag and drop files here (PDF, DOC, DOCX, XLS, XLSX)");
          return;
        }
        container.show();
        $("#fileInputDisplay").addClass("has-files");
        $("#fileInputText").text(`${selectedFiles.length} file(s) selected. Click to add more or drag and drop.`);
        const html = selectedFiles
          .map(
            (file, idx) => `
          <div class="selected-file-item">
            <span>${escapeHtml(file.name)} <small class="text-muted">(${formatFileSize(file.size)})</small></span>
            <button type="button" class="file-remove" data-idx="${idx}">Remove</button>
          </div>`
          )
          .join("");
        container.html(html);
        container.find(".file-remove").on("click", function () {
          const idx = $(this).data("idx");
          selectedFiles.splice(idx, 1);
          renderSelectedFiles();
        });
      }

      function formatFileSize(bytes) {
        if (bytes === 0) return "0 Bytes";
        const k = 1024;
        const sizes = ["Bytes", "KB", "MB", "GB"];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
      }

      function escapeHtml(str) {
        if (str == null) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      async function handleSubmit(e) {
        e.preventDefault();
        hideStatus();

        const inspectedBy = $("#inspectedBy").val().trim();
        const mandays = $("#mandays").val();

        if (!inspectedBy) {
          showStatus("Inspected By is required.", "error");
          $("#inspectedBy").focus();
          return;
        }
        if (!mandays) {
          showStatus("No. of ManDays is required.", "error");
          $("#mandays").focus();
          return;
        }

        Swal.fire({
          title: "Saving...",
          text: "Please wait while we save your data.",
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading(),
        });

        try {
          // First, fetch existing MDCC to get current remarks
          const mdccRes = await authFetch(`/api/data/qa/project/${projectId}/mdcc/all`);
          const mdccData = await mdccRes.json();
          const mdcc = mdccData.data ? mdccData.data.find((m) => String(m.mdcc_id) === String(mdccId)) : null;
          if (!mdcc) {
            Swal.close();
            showStatus("MDCC not found.", "error");
            return;
          }

          // Upload new files if any
          let newUploadedFiles = [];
          if (selectedFiles.length > 0) {
            const fd = new FormData();
            for (const file of selectedFiles) {
              fd.append("files", file);
            }
            const uploadRes = await fetch("/api/data/qa/mdcc/upload-files", {
              method: "POST",
              headers: { Authorization: `Bearer ${localStorage.getItem("token")}` },
              body: fd,
            });
            const uploadObj = await uploadRes.json();
            if (!uploadObj.success) {
              throw new Error(uploadObj.message || "File upload failed");
            }
            newUploadedFiles = uploadObj.files || [];
          }

          // Combine existing (after removals) and new
          const allFiles = existingFiles.concat(newUploadedFiles);

          // Update the MDCC
          const updateData = {
            inspected_by: inspectedBy,
            mandays: mandays,
            remarks: mdcc.remarks || null,
            uploaded_files: allFiles.length > 0 ? JSON.stringify(allFiles) : null,
          };

          const res = await authFetch(`/api/data/qa/mdcc/edit/${mdccId}`, {
            method: "PUT",
            body: JSON.stringify(updateData),
          });
          const resObj = await res.json();
          if (resObj.success) {
            Swal.fire({
              icon: "success",
              title: "Saved Successfully",
              text: "MDCC upload and inspection details saved successfully!",
              confirmButtonText: "Go to QA Dashboard",
            }).then(() => {
              window.location.href = "/qa_external.html";
            });
          } else {
            throw new Error(resObj.message || "Save failed");
          }
        } catch (err) {
          console.error("Error saving:", err);
          Swal.close();
          showStatus(err.message || "Failed to save. Please try again.", "error");
        }
      }
    </script>
  </body>
</html>
